[workspace]
name              = "ai-sizing-normalizer"
version           = "1.0.0"
description       = "Aspect-aware image resolution normalization with AI outpainting through ComfyUI."
channels          = ["conda-forge"]
platforms         = ["win-64", "linux-64", "osx-arm64"]

[tasks]
run               = "python resolution_snap.py"
dry-run           = "python resolution_snap.py --dry-run"
list-buckets      = "python resolution_snap.py --list-buckets"
verbose           = "python resolution_snap.py --verbose"
test              = "python -m unittest discover -s tests -v"
check             = "python -m compileall -q resolution_snap.py tests"

[dependencies]
python            = ">=3.11"
pillow            = ">=10.0"
requests          = ">=2.28"
websocket-client  = ">=1.6"
