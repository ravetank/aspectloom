[workspace]
name              = "aspectloom"
version           = "1.0.0"
description       = "Aspect-aware AI outpainting that weaves images into standard resolutions through ComfyUI."
channels          = ["conda-forge"]
platforms         = ["win-64", "linux-64", "osx-arm64"]

[tasks]
run               = "python aspectloom.py"
dry-run           = "python aspectloom.py --dry-run"
list-buckets      = "python aspectloom.py --list-buckets"
verbose           = "python aspectloom.py --verbose"
test              = "python -m unittest discover -s tests -v"
check             = "python -m compileall -q aspectloom.py resolution_snap.py tests"

[dependencies]
python            = ">=3.11"
pillow            = ">=10.0"
requests          = ">=2.28"
websocket-client  = ">=1.6"
